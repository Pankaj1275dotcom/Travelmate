services:
  - type: web
    name: travelmate-api
    env: node
    rootDir: .
    buildCommand: |
      npm install
      npm run build --workspace database
      npm run build --workspace services/api
    startCommand: npm run start --workspace services/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
